name: Deploy Witch's Pantry to GitHub Pages

# Builds the Witch's Pantry web app and publishes it to GitHub Pages.
# The CLI app and the MCP servers are not deployed; only the browser UI.

on:
  push:
    branches: [main]
    paths:
      - 'apps/witches-pantry/**'
      - 'packages/skeleton/**'
      - '.github/workflows/deploy-pantry.yml'
      - 'pnpm-lock.yaml'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a new push cancel an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        # VITE_BASE must match the Pages subpath: https://<user>.github.io/<repo>/
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm --filter witches-pantry build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/witches-pantry/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
